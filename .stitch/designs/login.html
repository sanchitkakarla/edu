<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduManage Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#000000",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-fixed-variant": "#38485d",
                        "outline": "#76777d",
                        "primary-container": "#131b2e",
                        "tertiary-container": "#191c1e",
                        "surface-tint": "#565e74",
                        "error": "#ba1a1a",
                        "outline-variant": "#c6c6cd",
                        "on-secondary-fixed": "#0b1c30",
                        "on-primary-container": "#7c839b",
                        "on-error-container": "#93000a",
                        "secondary-container": "#d0e1fb",
                        "on-surface-variant": "#45464d",
                        "on-primary-fixed": "#131b2e",
                        "surface-dim": "#dadada",
                        "on-error": "#ffffff",
                        "surface-container": "#eeeeee",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-variant": "#e2e2e2",
                        "secondary": "#505f76",
                        "on-secondary-container": "#54647a",
                        "inverse-surface": "#2f3131",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-container-low": "#f3f3f4",
                        "surface": "#f9f9f9",
                        "on-tertiary-fixed": "#191c1e",
                        "inverse-on-surface": "#f0f1f1",
                        "on-background": "#1a1c1c",
                        "primary": "#000000",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed-dim": "#bec6e0",
                        "primary-fixed": "#dae2fd",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#e0e3e5",
                        "on-primary-fixed-variant": "#3f465c",
                        "inverse-primary": "#bec6e0",
                        "on-tertiary-container": "#818486"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max-width": "1440px",
                        "stack-md": "1rem",
                        "margin-page": "2rem",
                        "gutter": "1.5rem",
                        "stack-sm": "0.5rem",
                        "nav-width": "260px",
                        "stack-lg": "2rem"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "label-md": ["Inter"],
                        "h3": ["Inter"],
                        "h1": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "h3": ["20px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
                        "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-bg-pattern {
            background-color: #f9f9f9;
            background-image: radial-gradient(#c6c6cd 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-6 login-bg-pattern">
<!-- Login Container -->
<main class="w-full max-w-[480px]">
<!-- Brand Identity Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="school">school</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-tight">EduManage</h1>
<p class="font-body-md text-body-md text-secondary mt-2">Academic Administration Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 md:p-10 shadow-sm transition-all duration-300">
<header class="mb-8">
<h2 class="font-h2 text-h2 text-on-surface">Admin Login</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Please enter your credentials to access the dashboard.</p>
</header>
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg text-on-surface font-body-md focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all" id="email" name="email" placeholder="admin@edumanage.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-on-primary-container hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg text-on-surface font-body-md focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container outline-none transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Security Check -->
<div class="flex items-center space-x-3 py-2">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 px-6 bg-primary-container text-on-primary font-h3 text-h3 rounded-lg hover:bg-black transition-all duration-200 transform active:scale-[0.98] shadow-md flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<footer class="mt-8 pt-6 border-t border-outline-variant">
<div class="flex flex-col gap-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Need technical support? 
                        <a class="text-on-primary-container font-semibold hover:underline" href="#">Contact IT Helpdesk</a>
</p>
</div>
</footer>
</div>
<!-- Footer Info -->
<div class="mt-12 grid grid-cols-2 gap-8 items-center border-t border-outline-variant pt-6 opacity-60">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="verified_user">verified_user</span>
<div class="leading-tight">
<p class="font-caption text-caption uppercase font-bold text-secondary">Secure Portal</p>
<p class="font-caption text-caption text-secondary">AES-256 Encryption</p>
</div>
</div>
<div class="text-right">
<p class="font-caption text-caption text-secondary">© 2024 EduManage System</p>
<p class="font-caption text-caption text-secondary">v4.2.1-stable</p>
</div>
</div>
</main>
<!-- Background Illustrative Element (Hidden on small screens) -->
<div class="hidden lg:block fixed -bottom-24 -right-24 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl"></div>
<div class="hidden lg:block fixed -top-24 -left-24 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl"></div>
</body></html>
